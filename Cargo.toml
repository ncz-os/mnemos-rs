[package]
name = "mnemosctl"
version = "0.1.0"
edition = "2021"
authors = ["Jason Perlow <jperlow@gmail.com>"]
description = "MNEMOS desktop CLI — sync, search, status, peer management"
license = "Apache-2.0"
repository = "https://github.com/mnemos-os/mnemos-rs"
readme = "README.md"

[[bin]]
name = "mnemosctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
toml = "0.8"
fs2 = "0.4"
thiserror = "1.0"

[dev-dependencies]
fs2 = "0.4"
httpmock = "0.7"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
